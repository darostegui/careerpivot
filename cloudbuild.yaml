steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="$$SUPABASE_URL" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$$SUPABASE_ANON_KEY" \
          --build-arg NEXT_PUBLIC_APP_URL="https://careerpivot.me" \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/careerpivot/careerpivot:$BUILD_ID .
    secretEnv:
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/careerpivot/careerpivot:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/careerpivot/careerpivot:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min=0
      - --max=2
      - --memory=512Mi
      - --cpu=1
      - --concurrency=40
      - --timeout=300
      - --port=8080
      - --set-env-vars=NODE_ENV=production,GEMINI_MODEL=${_GEMINI_MODEL},NEXT_PUBLIC_APP_URL=https://careerpivot.me
      - --set-secrets=GEMINI_API_KEY=careerpivot-gemini-api-key:latest,NEXT_PUBLIC_SUPABASE_URL=careerpivot-supabase-url:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=careerpivot-supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=careerpivot-supabase-service-role-key:latest,STRIPE_SECRET_KEY=careerpivot-stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=careerpivot-stripe-webhook-secret:latest,RESEND_API_KEY=careerpivot-resend-api-key:latest
substitutions:
  _SERVICE: careerpivot
  _REGION: us-central1
  _GEMINI_MODEL: gemini-3-flash-preview
options:
  logging: CLOUD_LOGGING_ONLY
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/careerpivot-supabase-url/versions/latest
      env: SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/careerpivot-supabase-anon-key/versions/latest
      env: SUPABASE_ANON_KEY
